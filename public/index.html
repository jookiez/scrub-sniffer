<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrub Sniffer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f0b429;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #8b949e;
      margin-bottom: 36px;
      font-size: 0.95rem;
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 640px;
      margin-bottom: 32px;
    }

    input, select {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus { border-color: #f0b429; }

    input[name="name"]   { flex: 2; min-width: 160px; }
    select[name="region"]{ flex: 1; min-width: 80px; }

    .server-combo { position: relative; flex: 2; min-width: 160px; }
    .server-combo input { width: 100%; }

    .server-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 3px);
      left: 0; right: 0;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      max-height: 220px;
      overflow-x: hidden;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .server-dropdown.open { display: block; }
    .server-dropdown li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 0.88rem;
      color: #c9d1d9;
    }
    .server-dropdown li:hover,
    .server-dropdown li.sd-active { background: #21262d; }
    .server-dropdown .sd-slug { color: #8b949e; font-family: monospace; font-size: 0.78rem; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }

    button {
      background: #f0b429;
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button:hover   { background: #f5c842; }
    button:disabled{ background: #4a3f1a; color: #6e5a1a; cursor: not-allowed; }

    #result { width: 100%; max-width: 640px; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .verdict-pass { border-color: #3fb950; }
    .verdict-scrub{ border-color: #f85149; }

    .verdict-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .verdict-badge {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 4px 16px;
      border-radius: 6px;
    }

    .badge-pass  { background: #1a3a20; color: #3fb950; }
    .badge-scrub { background: #3a1a1a; color: #f85149; }

    .char-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e6edf3;
    }

    .role-tag {
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 600;
      background: #21262d;
      color: #8b949e;
    }

    .reasons { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .reasons li {
      font-size: 0.9rem;
      padding: 8px 12px;
      background: #0d1117;
      border-radius: 6px;
      border-left: 3px solid #30363d;
      color: #8b949e;
    }
    .reasons li.ok   { border-color: #3fb950; color: #c9d1d9; }
    .reasons li.fail { border-color: #f85149; color: #c9d1d9; }
    .reasons li.warn { border-color: #f0b429; color: #c9d1d9; }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.9rem;
    }

    .stat-row:last-child { border-bottom: none; }
    .stat-val { font-weight: 600; color: #e6edf3; }

    .parse-bar-wrap { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }

    .parse-row {
      display: grid;
      grid-template-columns: 1fr 42px 120px;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
    }

    .dungeon-name { color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .parse-pct    { text-align: right; font-weight: 600; }
    .bar-bg       { background: #21262d; border-radius: 4px; height: 8px; overflow: hidden; }
    .bar-fill     { height: 100%; border-radius: 4px; transition: width 0.4s ease; }

    .copy-link-btn {
      background: none;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .copy-link-btn:hover    { border-color: #f0b429; color: #f0b429; }
    .copy-link-btn:disabled { border-color: #3fb950; color: #3fb950; cursor: default; }

    .error-msg {
      color: #f85149;
      background: #3a1a1a;
      border: 1px solid #f85149;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    #spinner {
      display: none;
      color: #8b949e;
      font-size: 0.9rem;
      margin-top: 8px;
    }
  </style>
</head>

        {n:'Nethersturm',s:'nethersturm'},{n:'Nordrassil',s:'nordrassil'},{n:'Norgannon',s:'norgannon'},
        {n:'Outland',s:'outland'},{n:'Perenolde',s:'perenolde'},{n:'Proudmoore',s:'proudmoore'},
        {n:'Ragnaros',s:'ragnaros'},{n:'Ravencrest',s:'ravencrest'},{n:'Ravenholdt',s:'ravenholdt'},
        {n:'Razuvious',s:'razuvious'},{n:'Rexxar',s:'rexxar'},{n:'Runetotem',s:'runetotem'},
        {n:'Sanguino',s:'sanguino'},{n:'Sargeras',s:'sargeras'},{n:'Saurfang',s:'saurfang'},
        {n:'Shadowmoon',s:'shadowmoon'},{n:'Shadowsong',s:'shadowsong'},
        {n:'Shattered Hand',s:'shattered-hand'},{n:'Silvermoon',s:'silvermoon'},
        {n:'Skullcrusher',s:'skullcrusher'},{n:'Skywall',s:'skywall'},
        {n:'Spinebreaker',s:'spinebreaker'},{n:'Stormrage',s:'stormrage'},
        {n:'Stormreaver',s:'stormreaver'},{n:'Stormscale',s:'stormscale'},
        {n:'Sunstrider',s:'sunstrider'},{n:'Sylvanas',s:'sylvanas'},{n:'Talnivarr',s:'talnivarr'},
        {n:'Tarren Mill',s:'tarren-mill'},{n:'Terenas',s:'terenas'},
        {n:'The Maelstrom',s:'the-maelstrom'},{n:"The Sha'tar",s:'the-shatar'},
        {n:'The Venture Co',s:'the-venture-co'},{n:'Theradras',s:'theradras'},
        {n:'Thrall',s:'thrall'},{n:'Thunderhorn',s:'thunderhorn'},{n:'Tichondrius',s:'tichondrius'},
        {n:'Tirion',s:'tirion'},{n:'Tortheldrin',s:'tortheldrin'},{n:'Trollbane',s:'trollbane'},
        {n:'Turalyon',s:'turalyon'},{n:'Twisting Nether',s:'twisting-nether'},
        {n:'Tyrande',s:'tyrande'},{n:'Uldaman',s:'uldaman'},{n:'Vashj',s:'vashj'},
        {n:"Vol'jin",s:'voljin'},{n:'Wildhammer',s:'wildhammer'},{n:'Wrathbringer',s:'wrathbringer'},
        {n:'Ysera',s:'ysera'},{n:'Ysondre',s:'ysondre'},{n:'Zenedar',s:'zenedar'},
        {n:"Zul'jin",s:'zuljin'},
      ],
      kr: [
        {n:'아즈샤라 (Azshara)',s:'azshara'},{n:'굴단 (Guldan)',s:'guldan'},
        {n:'하이잘 (Hyjal)',s:'hyjal'},{n:"줄진 (Zul'jin)",s:'zuljin'},
        {n:'말퓨리온 (Malfurion)',s:'malfurion'},{n:'헬스크림 (Hellscream)',s:'hellscream'},
        {n:'윈드러너 (Windrunner)',s:'windrunner'},{n:'렉사르 (Rexxar)',s:'rexxar'},
        {n:'세나리우스 (Cenarius)',s:'cenarius'},{n:'노르가논 (Norgannon)',s:'norgannon'},
      ],
      tw: [
        {n:'世界之樹 (World Tree)',s:'world-tree'},{n:'尖石 (Chiseled Rock)',s:'chiseled-rock'},
        {n:'冰霜之刺 (Frostmane)',s:'frostmane'},{n:'巨龍之喉 (Dragonmaw)',s:'dragonmaw'},
        {n:'亞雷戈斯 (Arygos)',s:'arygos'},{n:'血之谷 (Bleeding Hollow)',s:'bleeding-hollow'},
        {n:'水曜日 (Hydraxis)',s:'hydraxis'},{n:'雲蛟衛 (Spirestone)',s:'spirestone'},
      ],
    };

    const serverInput    = document.getElementById('server-input');
    const serverDropdown = document.getElementById('server-dropdown');
    let sdActiveIdx = -1;

    function sdFilter(query) {
      const list = SERVERS[document.querySelector('select[name="region"]').value] ?? [];
      if (!query) return list.slice(0, 25);
      const q = query.toLowerCase();
      return list.filter(s => s.n.toLowerCase().includes(q) || s.s.includes(q)).slice(0, 25);
    }

    function sdRender(items) {
      serverDropdown.innerHTML = '';
      sdActiveIdx = -1;
      if (!items.length) { serverDropdown.classList.remove('open'); return; }
      items.forEach((s, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${s.n}</span>`;
        li.dataset.slug = s.s;
        li.addEventListener('mousedown', e => { e.preventDefault(); sdSelect(s); });
        serverDropdown.appendChild(li);
      });
      serverDropdown.classList.add('open');
    }

    function sdSelect(s) {
      serverInput.value = s.s;
      serverDropdown.classList.remove('open');
    }

    serverInput.addEventListener('input',  () => sdRender(sdFilter(serverInput.value)));
    serverInput.addEventListener('focus',  () => sdRender(sdFilter(serverInput.value)));
    serverInput.addEventListener('blur',   () => setTimeout(() => serverDropdown.classList.remove('open'), 150));
    serverInput.addEventListener('keydown', e => {
      const items = serverDropdown.querySelectorAll('li');
      if (!serverDropdown.classList.contains('open') || !items.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        sdActiveIdx = Math.min(sdActiveIdx + 1, items.length - 1);
        items.forEach((li, i) => li.classList.toggle('sd-active', i === sdActiveIdx));
        items[sdActiveIdx]?.scrollIntoView({block:'nearest'});
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        sdActiveIdx = Math.max(sdActiveIdx - 1, -1);
        items.forEach((li, i) => li.classList.toggle('sd-active', i === sdActiveIdx));
        items[sdActiveIdx]?.scrollIntoView({block:'nearest'});
      } else if (e.key === 'Enter' && sdActiveIdx >= 0) {
        e.preventDefault();
        sdSelect({s: items[sdActiveIdx].dataset.slug, n: items[sdActiveIdx].querySelector('span').textContent});
        // Let the form submit naturally on next Enter
      } else if (e.key === 'Escape') {
        serverDropdown.classList.remove('open');
      }
    });

    document.querySelector('select[name="region"]').addEventListener('change', () => {
      serverInput.value = '';
      serverDropdown.classList.remove('open');
    });

    // ---------------------------------------------------------------------------
    // Main app
    // ---------------------------------------------------------------------------
    const form      = document.getElementById('lookup-form');
    const resultEl  = document.getElementById('result');
    const spinner   = document.getElementById('spinner');
    const submitBtn = document.getElementById('submit-btn');

    function parseColor(pct) {
      if (pct >= 95) return '#ff8000';
      if (pct >= 75) return '#a335ee';
      if (pct >= 50) return '#0070dd';
      if (pct >= 25) return '#1eff00';
      return '#9d9d9d';
    }

    function reasonClass(text) {
      if (text.startsWith('⚠')) return 'warn';
      if (/too low|no |not |borderline and not|struggles|only \d+\/\d+/i.test(text)) return 'fail';
      return 'ok';
    }

    function renderResult(data) {
      const { character, verdict, reasons, mplus, raid, interrupts, topDps } = data;
      const { role } = character;
      const isPass  = verdict === 'PASS';
      const metricLabel = 'Score'; // M+ always uses playerscore (key level × time), not role-specific metrics

      const runsHtml = (mplus.runs ?? []).slice(0, 5).map(run => `
        <div class="parse-row">
          <span class="dungeon-name">${run.dungeon}</span>
          <span class="parse-pct" style="color:${parseColor(run.percentile)}">${run.percentile}%</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${run.percentile}%;background:${parseColor(run.percentile)}"></div></div>
        </div>
      `).join('');

      const reasonsHtml = reasons.map(r => `
        <li class="${reasonClass(r)}">${r}</li>
      `).join('');

      const intLabel = 'Interrupts (top-2)';
      const intCount = interrupts.rank1or2Count;
      const intVal   = interrupts.totalRuns > 0 ? `${intCount}/${interrupts.totalRuns} runs` : 'No data';
      const intLine  = `<div class="stat-row"><span>${intLabel}</span><span class="stat-val">${intVal}</span></div>`;

      const topDpsLine = (role === 'dps' && topDps)
        ? (() => {
            const val = topDps.totalRuns > 0 ? `${topDps.rank1Count}/${topDps.totalRuns} runs` : 'No data';
            const color = topDps.topDps ? '#3fb950' : '#8b949e';
            return `<div class="stat-row"><span>Top DPS in key</span><span class="stat-val" style="color:${color}">${val}</span></div>`;
          })()
        : '';

      resultEl.innerHTML = `
        <div class="card ${isPass ? 'verdict-pass' : 'verdict-scrub'}">
          <div class="verdict-header">
            <span class="verdict-badge ${isPass ? 'badge-pass' : 'badge-scrub'}">${verdict}</span>
            <span class="char-name">${character.name}-${character.server}</span>
            <span class="role-tag">${character.roleLabel}${character.specName ? ' · ' + character.specName : ''}</span>
            <button class="copy-link-btn" id="copy-link-btn" style="margin-left:auto">Copy link</button>
          </div>
          <ul class="reasons">${reasonsHtml}</ul>
        </div>

        <div class="card">
          <div class="section-title">Mythic+ ${metricLabel}</div>
          ${mplus.hasLogs ? `
            <div class="stat-row"><span>Avg parse</span><span class="stat-val" style="color:${parseColor(mplus.avgPercentile)}">${mplus.avgPercentile}%</span></div>
            <div class="stat-row"><span>Runs sampled</span><span class="stat-val">${mplus.runs.length}</span></div>
            ${intLine}
            ${topDpsLine}
            <div class="parse-bar-wrap">${runsHtml}</div>
            ${(mplus.missingDungeons ?? []).length > 0
              ? `<p style="color:#f0b429;font-size:.82rem;margin-top:8px">⚠ No data for: ${mplus.missingDungeons.join(', ')}</p>`
              : ''
            }
          ` : '<p style="color:#8b949e;font-size:.9rem">No M+ logs found.</p>'}
        </div>

        <div class="card">
          <div class="section-title">Raid</div>
          ${raid.hasLogs ? `
            <div class="stat-row"><span>Avg parse</span><span class="stat-val" style="color:${parseColor(raid.avgParse)}">${raid.avgParse}%</span></div>
            <div class="stat-row"><span>Mythic encounters</span><span class="stat-val">${raid.mythicCount}</span></div>
            <div class="stat-row"><span>Heroic encounters</span><span class="stat-val">${raid.heroicCount}</span></div>
          ` : '<p style="color:#8b949e;font-size:.9rem">No heroic/mythic raid logs found.</p>'}
        </div>
      `;
    }

    resultEl.addEventListener('click', (e) => {
      const btn = e.target.closest('#copy-link-btn');
      if (!btn) return;
      navigator.clipboard.writeText(location.href).then(() => {
        btn.textContent = 'Copied!';
        btn.disabled = true;
        setTimeout(() => { btn.textContent = 'Copy link'; btn.disabled = false; }, 2000);
      });
    });

    async function runLookup(name, server, region) {
      resultEl.innerHTML = '';
      spinner.style.display = 'block';
      submitBtn.disabled = true;

      const params = new URLSearchParams({ name, server, region });
      history.replaceState(null, '', '?' + params.toString());

      try {
        const res  = await fetch(`/api/lookup?${params}`);
        const data = await res.json();

        if (!res.ok) {
          resultEl.innerHTML = `<div class="error-msg">${data.error ?? 'Unknown error'}</div>`;
        } else {
          renderResult(data);
        }
      } catch (err) {
        resultEl.innerHTML = `<div class="error-msg">Request failed: ${err.message}</div>`;
      } finally {
        spinner.style.display = 'none';
        submitBtn.disabled = false;
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      runLookup(form.name.value.trim(), form.server.value.trim(), form.region.value);
    });

    // Pre-fill and auto-run from URL params (shareable links)
    const qp = new URLSearchParams(location.search);
    if (qp.get('name') && qp.get('server')) {
      form.name.value   = qp.get('name');
      form.server.value = qp.get('server');
      if (qp.get('region')) form.region.value = qp.get('region');
      runLookup(form.name.value, form.server.value, form.region.value);
    }
  </script>

</body>
