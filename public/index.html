<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrub Sniffer</title>
  <meta name="description" content="WoW M+ player vetting tool. Grade players PASS or SCRUB based on parse percentiles, raid history, and interrupt performance." />
  <meta name="author" content="Scrub Sniffer" />
  <meta name="robots" content="index, follow" />

  <!-- Social Sharing: Open Graph -->
  <meta property="og:title" content="Scrub Sniffer" />
  <meta property="og:description" content="WoW M+ player vetting tool. Grade players PASS or SCRUB based on parse percentiles, raid history, and interrupt performance." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://scrubsniffer.com/social-share.png" />
  <meta property="og:site_name" content="Scrub Sniffer" />

  <!-- Social Sharing: Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Scrub Sniffer" />
  <meta name="twitter:description" content="WoW M+ player vetting tool. Grade players PASS or SCRUB based on parse percentiles, raid history, and interrupt performance." />
  <meta name="twitter:image" content="https://scrubsniffer.com/social-share.png" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "WebSite",
    "name": "Scrub Sniffer",
    "url": "https://scrubsniffer.com/",
    "description": "WoW M+ player vetting tool. Grade players PASS or SCRUB based on parse percentiles, raid history, and interrupt performance."
  }
  </script>

  <!-- Favicon for browsers -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <h1>👃 Scrub Sniffer</h1>
  <p class="subtitle">WoW M+ player vetter — no scrubs allowed</p>

  <form id="lookup-form">
    <input name="name"   type="text"   placeholder="Character name" required autocomplete="off" />
    <div class="server-combo">
      <input name="server" type="text" placeholder="Server (e.g. area-52)" required autocomplete="off" id="server-input" />
      <ul class="server-dropdown" id="server-dropdown" role="listbox"></ul>
    </div>
    <select name="region">
      <option value="us">US</option>
      <option value="eu">EU</option>
      <option value="kr">KR</option>
      <option value="tw">TW</option>
    </select>
    <button type="submit" id="submit-btn">Sniff</button>
  </form>

  <p id="spinner">Checking logs...</p>
  <div id="result"></div>

  <script src="/app.js"></script>

</body>
</html>
