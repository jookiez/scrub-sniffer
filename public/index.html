  <script type="application/ld+json">

    "@context": "https://schema.org/",
    "@type": "WebSite",
    "name": "Scrub Sniffer",
    "url": "https://scrubsniffer.com/",
    "description": "WoW M+ player vetting tool. Grade players PASS or SCRUB based on parse percentiles, raid history, and interrupt performance."
  }
  </script>

  <!-- Favicon for browsers -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

<body>

  <h1>👃 Scrub Sniffer</h1>
  <p class="subtitle">WoW M+ player vetter — no scrubs allowed</p>

  <div class="mode-toggle">
    <button type="button" id="mode-single" class="mode-btn active">Single</button>
    <button type="button" id="mode-compare" class="mode-btn">Compare</button>
  </div>

  <div id="forms-wrap" class="forms-wrap">
    <form id="lookup-form" class="lookup-form">
      <input name="name"   type="text"   placeholder="Character name" required autocomplete="off" />
      <div class="server-combo">
        <input name="server" type="text" placeholder="Server (e.g. area-52)" required autocomplete="off" id="server-input" />
        <ul class="server-dropdown" id="server-dropdown" role="listbox"></ul>
      </div>
      <select name="region">
        <option value="us">US</option>
        <option value="eu">EU</option>
        <option value="kr">KR</option>
        <option value="tw">TW</option>
      </select>
      <button type="submit" id="submit-btn">Sniff</button>
    </form>

    <div class="compare-form-divider"></div>

    <form id="lookup-form-2" class="lookup-form compare-form" style="display:none">
      <input name="name"   type="text"   placeholder="Character name" required autocomplete="off" />
      <div class="server-combo">
        <input name="server" type="text" placeholder="Server (e.g. area-52)" required autocomplete="off" id="server-input-2" />
        <ul class="server-dropdown" id="server-dropdown-2" role="listbox"></ul>
      </div>
      <select name="region">
        <option value="us">US</option>
        <option value="eu">EU</option>
        <option value="kr">KR</option>
        <option value="tw">TW</option>
      </select>
      <button type="submit" id="submit-btn-2">Sniff</button>
    </form>
  </div>

  <p id="spinner">Checking logs...</p>
  <div id="result"></div>

  <!-- scrub-sniffer-result-bottom -->
  <ins class="adsbygoogle"
       style="display:block; width:100%; max-width:640px; min-height:280px; margin:16px auto;"
       data-ad-client="ca-pub-1210813108489809"

       data-ad-format="auto"
       data-full-width-responsive="true"></ins>

  <footer class="site-footer">
    <a href="https://ko-fi.com/scrubsniffer" target="_blank" rel="noopener">
      ☕ Buy me a coffee :)
    </a>
  </footer>

  <a href="/privacy.html" class="privacy-corner">Privacy</a>

  <script src="/app.js"></script>

</body>
</html>
